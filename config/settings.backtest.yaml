# Backtesting against real historical OHLC data. Runs entirely on Linux
# Cloud — no MT5 terminal involved; this only reads CSV files under
# data/historical/, generated from data/market/ by
# scripts/build_m1_historical_data.py (the current, single source of raw
# market data for this project — see that script's docstring). An older
# MT5-export-based path (scripts/convert_mt5_export.py) predates this and
# is retained only as historical/legacy tooling for a dataset no longer
# present in this repository.

environment: backtest

data_source:
  provider: historical_file
  historical_dir: data/historical

risk:
  presets_percent: [0.25, 0.50, 1.00, 1.50, 2.00]
  allow_custom_risk_percent: true
  min_risk_reward: 1.5      # hard floor — setups below this are rejected, never a target
  max_risk_reward: null

lots:
  presets: [0.01, 0.02, 0.05, 0.10, 0.20, 0.50, 1.00]
  allow_custom_lot: true

confidence:
  thresholds:
    weak_max: 49
    medium_max: 74
    strong_min: 75
  multi_strategy_agreement_bonus: 10

timeframes:
  default_mapping:
    higher: H4
    middle: H1
    entry: M15
  selection_rules:
    - condition: high_volatility
      entry: M5
  # Per-entry-timeframe Higher/Middle mapping, used ONLY by the Backtesting
  # Engine (TimeframeSelector.resolve_for_entry) when testing an entry
  # timeframe other than the fixed one default_mapping/selection_rules alone
  # would ever produce for live /analyze. default_mapping above is left
  # untouched and still governs live /analyze exactly as before (it never
  # calls resolve_for_entry) -- this table is additive, single-source-of-
  # truth configuration, not a second Python-hardcoded copy of the same
  # concept (see backtesting/engine.py and core/context/timeframe_selector
  # .py for the two call sites).
  #
  # Rule for every row: Higher is never a timeframe below Entry, and Entry
  # is never used as Higher unless technically unavoidable given the
  # timeframes this pipeline actually generates (M1/M5/M15/M30/H1/H4 — see
  # scripts/build_m1_historical_data.py; D1 is NOT generated by this
  # pipeline, so it cannot be used here).
  #   M15 row matches default_mapping exactly -- production's only entry
  #   timeframe is unaffected by this table's existence.
  #   H1 row: no timeframe in this pipeline sits strictly between H1 and
  #   H4, so Middle==Entry (H1) is an unavoidable, explicitly accepted
  #   duplicate role -- Higher (H4) is still strictly coarser than Entry.
  #   H4 row: H4 is the HIGHEST timeframe this pipeline generates (D1 is
  #   not available), so per the documented fallback ("if D1 is not
  #   available, use the highest valid available timeframe"), Higher=H4
  #   and Middle=H4 both duplicate Entry (H4) here -- an unavoidable,
  #   explicitly accepted degenerate case, not an invented new timeframe.
  entry_mapping:
    M1:  { higher: M15, middle: M5 }
    M5:  { higher: H1,  middle: M15 }
    M15: { higher: H4,  middle: H1 }
    M30: { higher: H4,  middle: H1 }
    H1:  { higher: H4,  middle: H1 }
    H4:  { higher: H4,  middle: H4 }

tp_rules:
  sources: [support_resistance, liquidity, order_blocks, fvg, structure, fibonacci]

sl_rules:
  sources: [structure, order_blocks, atr]

symbols:
  - name: EURUSD
    pip_size: 0.0001
    digits: 5
    contract_size: 100000
  - name: XAUUSD
    pip_size: 0.01
    digits: 2
    contract_size: 100
  - name: GBPUSD
    pip_size: 0.0001
    digits: 5
    contract_size: 100000
  - name: NZDUSD
    pip_size: 0.0001
    digits: 5
    contract_size: 100000

session:
  definitions:
    Asian: { start_utc: "00:00", end_utc: "07:00" }
    London: { start_utc: "07:00", end_utc: "12:00" }
    NewYork: { start_utc: "12:00", end_utc: "17:00" }
    LondonNewYorkOverlap: { start_utc: "12:00", end_utc: "16:00" }

data:
  lookback_bars:
    higher: 200
    middle: 300
    entry: 500
  max_spread:  # in pips (converted to price units via each symbol's pip_size)
    EURUSD: 2.0
    XAUUSD: 5.0
    GBPUSD: 3.0
    NZDUSD: 3.0

analysis:
  validity:
    mode: entry_timeframe_multiple
    bars_multiplier: 1
    fixed_minutes: null
