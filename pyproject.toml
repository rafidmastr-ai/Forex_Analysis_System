[project]
name = "forex-analysis-system"
version = "0.1.0"
description = "Multi-strategy (Classic/SMC/ICT) forex analysis engine with a pluggable market data layer."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration_mock"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused set (pyflakes/pycodestyle/isort) rather than the full
# opinionated default rule set — this project lints for real bugs, not style.
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length is advisory here; long dataclass/rationale lines are common

